name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            local_relay/package-lock.json
            mac_bridge/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Install Node dependencies
        run: |
          npm --prefix local_relay ci
          npm --prefix mac_bridge install
      - name: Node tests
        run: |
          npm test
          npm --prefix local_relay run test:integration
      - name: Android tests and APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: codex-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
