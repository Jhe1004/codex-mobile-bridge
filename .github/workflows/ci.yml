name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            local_relay/package-lock.json
            mac_bridge/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          test -x "$sdkmanager_bin"
          yes | "$sdkmanager_bin" --licenses >/dev/null || true
          "$sdkmanager_bin" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install Node dependencies
        run: |
          npm --prefix local_relay ci
          npm --prefix mac_bridge install
      - name: Node tests
        run: |
          npm test
          npm --prefix local_relay run test:integration
      - name: Android tests and APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: codex-mobile-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  macos-manager:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build native manager
        run: ./macos_manager/scripts/build_app.sh
      - name: Verify application bundle
        run: |
          codesign --verify --deep --strict --verbose=2 "macos_manager/artifacts/Codex 手机桥接.app"
          plutil -lint "macos_manager/artifacts/Codex 手机桥接.app/Contents/Info.plist"
